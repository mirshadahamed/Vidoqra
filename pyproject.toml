[project]
name = "vidoqra"
version = "1.0.0"
description = "Universal Video Downloader & Media Format Inspector"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "yt-dlp>=2024.10.7",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "websockets>=13.1",
    "python-multipart>=0.0.12",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
